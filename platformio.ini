; PlatformIO Project Configuration File
; Target: ESP32-S3 Generic with Dual-OTA Partition Table

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor speed
monitor_speed = 115200

; Dual-OTA partition scheme (8MB Flash: otadata @ 0xE000, ota_0 @ 0x10000, ota_1 @ 0x340000)
board_build.partitions = default_8MB.csv

; Flash mode DIO for maximum compatibility across ESP32-S3 modules (QIO/DIO)
board_build.flash_mode = dio

; Automatic post-build script to export binaries into firmware/ for GitHub Pages
extra_scripts = post:copy_firmware.py
